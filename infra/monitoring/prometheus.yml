global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'boloindia-prod'
    environment: 'development'

scrape_configs:
  # 🔥 Kong Gateway Metrics (NEW)
  - job_name: 'kong'
    static_configs:
      - targets: ['kong:8001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Auth Service
  - job_name: 'auth-service'
    static_configs:
      - targets: ['host.docker.internal:6001']
    metrics_path: '/auth-service/metrics'
    scrape_interval: 15s

  # Org Service
  - job_name: 'org-service'
    static_configs:
      - targets: ['host.docker.internal:6002']
    metrics_path: '/org-service/metrics'
    scrape_interval: 15s

  # Service Service
  - job_name: 'service-service'
    static_configs:
      - targets: ['host.docker.internal:6003']
    metrics_path: '/service-service/metrics'
    scrape_interval: 15s

  # QR Service
  - job_name: 'qr-service'
    static_configs:
      - targets: ['host.docker.internal:6004']
    metrics_path: '/qr-service/metrics'
    scrape_interval: 15s

  # Feedback Service
  - job_name: 'feedback-service'
    static_configs:
      - targets: ['host.docker.internal:6005']
    metrics_path: '/health'
    scrape_interval: 15s

  # Response Service
  - job_name: 'response-service'
    static_configs:
      - targets: ['host.docker.internal:6006']
    metrics_path: '/health'
    scrape_interval: 15s

  # Notification Service
  - job_name: 'notification-service'
    static_configs:
      - targets: ['host.docker.internal:6007']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['boloindia_postgres:5432']
    scrape_interval: 30s

  # MongoDB
  - job_name: 'mongodb'
    static_configs:
      - targets: ['boloindia_mongodb:27017']
    scrape_interval: 30s

  # Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:19092']
    scrape_interval: 30s
