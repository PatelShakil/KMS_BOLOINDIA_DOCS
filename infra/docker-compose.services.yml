# services-compose.yml
# BoloIndia Microservices - Single Click Deployment

version: '3.9'

services:

  # ==========================================
  # JAKARTA EE SERVICES (Payara Micro)
  # ==========================================

  # 1. Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: boloindia_auth_service
    restart: unless-stopped
    ports:
      - "6001:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://boloindia_postgres:5432/boloindia_dev?currentSchema=auth_service
      - DATABASE_USER=boloindia
      - DATABASE_PASSWORD=boloindiapass
      - JWT_PRIVATE_KEY_PATH=/app/keys/privateKey.pem
      - JWT_PUBLIC_KEY_PATH=/app/keys/publicKey.pem
    volumes:
      - ./keys:/app/keys:ro
    networks:
      - boloindia-net
    # depends_on:
    #   - postgres_boloindia_postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Organization Service
  org-service:
    build:
      context: ./org-service
      dockerfile: Dockerfile
    container_name: boloindia_org_service
    restart: unless-stopped
    ports:
      - "6002:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://boloindia_postgres:5432/boloindia_dev?currentSchema=org_service
      - DATABASE_USER=boloindia
      - DATABASE_PASSWORD=boloindiapass
      - JWT_PUBLIC_KEY_PATH=/app/keys/publicKey.pem
      - KAFKA_BROKERS=boloindia_kafka:9092
    volumes:
      - ./keys:/app/keys:ro
    networks:
      - boloindia-net
    # depends_on:
    #   - postgres_boloindia_postgres
    #   - postgres_boloindia_kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 3. QR Service
  qr-service:
    build:
      context: ./qr-service
      dockerfile: Dockerfile
    container_name: boloindia_qr_service
    restart: unless-stopped
    ports:
      - "6003:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://boloindia_postgres:5432/boloindia_dev?currentSchema=qr_service
      - DATABASE_USER=boloindia
      - DATABASE_PASSWORD=boloindiapass
      - JWT_PUBLIC_KEY_PATH=/app/keys/publicKey.pem
      - KAFKA_BROKERS=boloindia_kafka:9092
    volumes:
      - ./keys:/app/keys:ro
    networks:
      - boloindia-net
    # depends_on:
    #   - postgres_boloindia_postgres
    #   - postgres_boloindia_kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 4. Service Service
  service-service:
    build:
      context: ./service-service
      dockerfile: Dockerfile
    container_name: boloindia_service_service
    restart: unless-stopped
    ports:
      - "6004:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://boloindia_postgres:5432/boloindia_dev?currentSchema=service_service
      - DATABASE_USER=boloindia
      - DATABASE_PASSWORD=boloindiapass
      - JWT_PUBLIC_KEY_PATH=/app/keys/publicKey.pem
      - KAFKA_BROKERS=boloindia_kafka:9092
    volumes:
      - ./keys:/app/keys:ro
    networks:
      - boloindia-net
    # depends_on:
    #   - postgres_boloindia_postgres
    #   - postgres_boloindia_kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # NODE.JS SERVICES (Express + MongoDB)
  # ==========================================

  # 5. Feedback Service
  feedback-service:
    build:
      context: ./feedback-service
      dockerfile: Dockerfile
    container_name: boloindia_feedback_service
    restart: unless-stopped
    ports:
      - "6005:6005"
    env_file:
      - ./feedback-service/.env.docker
    networks:
      - boloindia-net
    # depends_on:
    #   - boloindia_mongodb
    #   - postgres_boloindia_kafka
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:6005/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 6. Response Service
  response-service:
    build:
      context: ./response-service
      dockerfile: Dockerfile
    container_name: boloindia_response_service
    restart: unless-stopped
    ports:
      - "6006:6006"
    env_file:
      - ./response-service/.env.docker
    networks:
      - boloindia-net
    # depends_on:
    #   - postgres_boloindia_mongodb
    #   - postgres_boloindia_kafka
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:6006/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 7. Notification Service
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: boloindia_notification_service
    restart: unless-stopped
    ports:
      - "6007:6007"
    env_file:
      - ./notification-service/.env.docker
    networks:
      - boloindia-net
    # depends_on:
    #   - postgres_boloindia_mongodb
    #   - postgres_boloindia_kafka
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:6007/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

# ==========================================
# EXTERNAL NETWORK
# ==========================================
networks:
  boloindia-net:
    external: true
    name: postgres_boloindia-net
