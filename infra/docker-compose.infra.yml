version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: boloindia_postgres
    restart: always
    environment:
      POSTGRES_USER: boloindia
      POSTGRES_PASSWORD: boloindiapass
      POSTGRES_DB: boloindia_dev
    ports:
      - "3606:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - boloindia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boloindia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MongoDB Database (FIXED!)
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: boloindia_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: boloindia
      MONGO_INITDB_ROOT_PASSWORD: boloindiapass
    ports:
      - "3607:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - boloindia-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Mongo Express (MongoDB Web UI) - FIXED!
  # ============================================
  mongo-express:
    image: mongo-express:latest
    container_name: boloindia_mongo_express
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: boloindia
      ME_CONFIG_MONGODB_ADMINPASSWORD: boloindiapass
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - boloindia-net

  # ============================================
  # MinIO - S3-Compatible Object Storage
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: boloindia_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: boloindia
      MINIO_ROOT_PASSWORD: boloindiapass123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      boloindia-net:
        aliases:
          - boloindia-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================
  # Kafka with KRaft (No Zookeeper!)
  # ============================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: boloindia_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - boloindia-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ============================================
  # Kafka UI (Web-based Management)
  # ============================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: boloindia_kafka_ui
    restart: always
    depends_on:
      - kafka  # Just start after, don't wait for healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: boloindia-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - boloindia-net

  # ============================================
  # Prometheus (Metrics Collection)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: boloindia_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - boloindia-net

  # ============================================
  # Grafana (Monitoring Dashboard)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: boloindia_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - boloindia-net
    depends_on:
      - prometheus

volumes:
  pgdata:
  minio_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  mongodb_data:
  mongodb_config:

networks:
  boloindia-net:
    driver: bridge
