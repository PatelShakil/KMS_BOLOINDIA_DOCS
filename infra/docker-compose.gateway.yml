version: '3.9'

services:
  kong-migration:
    image: kong:3.5
    container_name: kong-migration
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: host.docker.internal
      KONG_PG_PORT: 3606
      KONG_PG_USER: boloindia
      KONG_PG_PASSWORD: boloindiapass
      KONG_PG_DATABASE: boloindia_dev
      KONG_PG_SCHEMA: kong
    networks:
      - postgres_boloindia-net  # ← Use actual network name
    restart: on-failure

  kong:
    image: kong:3.5
    container_name: kong-gateway
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: host.docker.internal
      KONG_PG_PORT: 3606
      KONG_PG_USER: boloindia
      KONG_PG_PASSWORD: boloindiapass
      KONG_PG_DATABASE: boloindia_dev
      KONG_PG_SCHEMA: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - kong-migration
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - postgres_boloindia-net  # ← Use actual network name
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kong-redis
    ports:
      - "6379:6379"
    networks:
      - postgres_boloindia-net  # ← Use actual network name
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  postgres_boloindia-net:
    external: true  # Join existing network
